# Warm Cream / Beige Light Theme (Claude-inspired)
name = Cream Light

# --- Warm Cream & Beige Color Palette ---
@accentColor = #6C5CE7
@accentHoverColor = #5A4BD1
@accentPressedColor = #4A3DB8
@background = #F5F0E8
@secondaryBackground = #FAF6F0
@tertiaryBackground = #D9D0C0
@foreground = #2B2825
@disabledForeground = #B8B0A0
@borderColor = #C4BAA8
@subtleBorderColor = #E3DBCB
@vibrantPurple = @accentColor
@selectionTint = #EDE7F7

# --- Global UI Overrides ---
Theme.background = @background
Theme.foreground = @foreground
Component.focusWidth = 2
Component.innerFocusWidth = 0
Component.borderWidth = 1
Component.disabledBackground = @tertiaryBackground
Component.disabledForeground = @disabledForeground
Component.arc = 12
Component.hideMnemonics = true

# --- Rounded Corners everywhere (Sleek Aesthetics) ---
Button.arc = 12
CheckBox.arc = 5
CheckBox.icon.style = filled
RadioButton.arc = 999
ProgressBar.arc = 12
TextComponent.arc = 10
PopupMenu.arc = 14
Menu.arc = 8
MenuItem.arc = 8
MenuBar.arc = 0
ToolTip.arc = 8
Spinner.arc = 10
ComboBox.arc = 10
ComboBox.buttonArc = 10
TabbedPane.arc = 10
Table.arc = 12
ScrollBar.thumbArc = 999
SplitPaneDivider.style = plain

# --- Component Spacing & Padding ---
Button.margin = 8,20,8,20
Button.minimumWidth = 72
TextField.margin = 8,12,8,12
TextField.minimumWidth = 72
ToggleButton.margin = 8,20,8,20
ComboBox.padding = 6,10,6,10
Spinner.padding = 6,10,6,10

# --- Buttons (warm beige) ---
Button.background = @tertiaryBackground
Button.foreground = @foreground
Button.borderColor = @borderColor
Button.startBorderWidth = 1
Button.default.background = @accentColor
Button.default.foreground = #ffffff
Button.default.borderColor = @accentColor
Button.default.boldText = false
Button.hoverBackground = #E0D9C9
Button.hoverBorderColor = @accentColor
Button.default.hoverBackground = @accentHoverColor
Button.pressedBackground = #D4CBB8
Button.default.pressedBackground = @accentPressedColor
Button.focusedBackground = @tertiaryBackground
Button.focusedBorderColor = @accentColor
Button.disabledBackground = @tertiaryBackground
Button.disabledText = @disabledForeground

# --- Toggle Buttons ---
ToggleButton.background = @tertiaryBackground
ToggleButton.selectedBackground = @accentColor
ToggleButton.selectedForeground = #ffffff
ToggleButton.hoverBackground = #E0D9C9

# --- CheckBox / RadioButton ---
CheckBox.icon.background = @secondaryBackground
CheckBox.icon.borderColor = @borderColor
CheckBox.icon.selectedBackground = @accentColor
CheckBox.icon.selectedBorderColor = @accentColor
CheckBox.icon.checkmarkColor = #ffffff
CheckBox.icon.hoverBorderColor = @accentColor
RadioButton.icon.background = @secondaryBackground
RadioButton.icon.borderColor = @borderColor
RadioButton.icon.selectedBackground = @accentColor
RadioButton.icon.selectedBorderColor = @accentColor
RadioButton.icon.centerDiameter = 8

# --- Text Fields & Inputs ---
TextField.background = @secondaryBackground
TextField.foreground = @foreground
TextField.caretColor = @accentColor
TextField.borderColor = @borderColor
TextField.focusedBorderColor = @accentColor
TextField.placeholderForeground = @disabledForeground
PasswordField.background = @secondaryBackground
PasswordField.focusedBorderColor = @accentColor
TextArea.background = @secondaryBackground
TextArea.foreground = @foreground
TextArea.caretColor = @accentColor

# --- ComboBox & Spinner ---
ComboBox.background = @secondaryBackground
ComboBox.buttonBackground = @tertiaryBackground
ComboBox.buttonEditableBackground = @secondaryBackground
ComboBox.focusedBorderColor = @accentColor
ComboBox.popupBackground = @secondaryBackground
Spinner.background = @secondaryBackground
Spinner.focusedBorderColor = @accentColor

# --- Lists & Tables ---
List.background = @secondaryBackground
List.selectionBackground = @selectionTint
List.selectionForeground = @foreground
List.selectionInactiveBackground = @tertiaryBackground
Table.background = @secondaryBackground
Table.selectionBackground = @selectionTint
Table.selectionForeground = @foreground
Table.alternateRowColor = #E8E0D0
Table.gridColor = #E3DBCB
Table.rowHeight = 36
Table.showHorizontalLines = false
Table.showVerticalLines = false
TableHeader.background = @background
TableHeader.hoverBackground = @tertiaryBackground
TableHeader.bottomSeparatorColor = @borderColor
TableHeader.height = 38

# --- Popup Menus / Menus / ToolTips ---
PopupMenu.background = @secondaryBackground
PopupMenu.borderColor = @borderColor
PopupMenu.borderInsets = 6,6,6,6
Menu.background = @secondaryBackground
Menu.selectionBackground = @vibrantPurple
Menu.selectionForeground = #ffffff
MenuItem.background = @secondaryBackground
MenuItem.selectionBackground = @vibrantPurple
MenuItem.selectionForeground = #ffffff
MenuItem.acceleratorForeground = @disabledForeground
MenuBar.background = @secondaryBackground
MenuBar.borderColor = @borderColor
ToolTip.background = #ffffff
ToolTip.foreground = @foreground
ToolTip.borderColor = @borderColor

# --- Progress Bars & Sliders ---
ProgressBar.foreground = @accentColor
ProgressBar.background = @borderColor
ProgressBar.selectionForeground = #ffffff
Slider.trackValueColor = @accentColor
Slider.trackColor = @borderColor
Slider.thumbColor = @accentColor
Slider.focusedColor = @accentColor
Slider.hoverThumbColor = @accentHoverColor

# --- Scrollbars (Ultra-Thin Minimal) ---
ScrollBar.thumbInsets = 3,3,3,3
ScrollBar.track = @background
ScrollBar.width = 10
ScrollBar.thumb = #C4BCAC
ScrollBar.hoverThumbColor = @accentColor
ScrollBar.showButtons = false

# --- Tabbed Pane ---
TabbedPane.shadow = @background
TabbedPane.background = @background
TabbedPane.selectedBackground = @secondaryBackground
TabbedPane.hoverColor = @tertiaryBackground
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = @borderColor
TabbedPane.contentAreaColor = @borderColor
TabbedPane.tabHeight = 40
TabbedPane.tabSelectionArc = 8
TabbedPane.showTabSeparators = false

# --- Separators / SplitPane ---
Separator.foreground = @borderColor
SplitPane.background = @background
SplitPaneDivider.background = @background
SplitPaneDivider.draggingColor = @accentColor

# --- Custom Window Title Bar ---
TitlePane.background = @background
TitlePane.foreground = @foreground
TitlePane.inactiveBackground = @background
TitlePane.inactiveForeground = @disabledForeground
TitlePane.borderColor = @borderColor
TitlePane.buttonHoverBackground = @tertiaryBackground
TitlePane.buttonPressedBackground = @subtleBorderColor
TitlePane.centerTitle = true
Window.arc = 14
